android {
    namespace 'moe.shizuku.manager'
    defaultConfig {
        applicationId "moe.shizuku.privileged.api"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        buildConfig true
        compose true
        viewBinding true
        prefab true
    }
    signingConfigs {
        sign
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            proguardFiles 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.31.0+"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['**']
        }
    }
    dependenciesInfo {
        includeInApk false
    }
    lint {
        checkReleaseBuilds false
        disable += ['MissingTranslation', 'ExtraTranslation', 'IntentReset']
    }
}

autoResConfig {
    generatedClassFullName = 'rikka.shizuku.manager.ShizukuLocales'
    generateRes = false
    generatedArrayFirstItem = 'SYSTEM'
    generateLocaleConfig = true
}

materialThemeBuilder {
    themes {
        shizuku {
            primaryColor = '#3F51B5'
            lightThemeFormat = 'Theme.Material3.Light.%s'
            lightThemeParent = 'Theme.Material3.Light.Rikka'
            darkThemeFormat = 'Theme.Material3.Dark.%s'
            darkThemeParent = 'Theme.Material3.Dark.Rikka'
        }
    }
    generatePalette = true
    generateTextColors = true
}

def collapseReleaseResourceNames = tasks.register('collapseReleaseResourceNames') {
    doLast {
        def sdkDirectory = androidComponents.sdkComponents.sdkDirectory.get().asFile
        def aapt2 = Paths.get(sdkDirectory.path, 'build-tools', android.buildToolsVersion, 'aapt2')
        def zip = Paths.get(project.buildDir.path, 'intermediates',
                'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
        def optimized = new File("${zip}.opt")
        def execResult = project.providers.exec {
            commandLine aapt2, 'optimize', '--collapse-resource-names',
                    '--resources-config-path', 'aapt2-resources.cfg',
                    '-o', optimized, zip
            ignoreExitValue = true
        }.result.get()
        if (execResult.exitValue == 0) {
            delete(zip)
            optimized.renameTo("$zip")
        }
    }
}

tasks.matching { it.name == 'optimizeReleaseResources' }.configureEach {
    finalizedBy(collapseReleaseResourceNames)
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(':shell:assembleRelease')
}

tasks.matching { it.name == 'preDebugBuild' }.configureEach {
    dependsOn(':shell:assembleDebug')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def variantCap = variantName.substring(0, 1).toUpperCase() + variantName.substring(1)

        tasks.matching { it.name == "assemble${variantCap}" }.configureEach {
            doLast {
                def outDir = new File(rootDir, 'out')
                def mappingDir = new File(outDir, 'mapping')
                def apkDir = new File(outDir, 'apk')

                if (variant.buildType == 'release') {
                    copy {
                        from layout.buildDirectory.file("outputs/mapping/${variantName}/mapping.txt")
                        into mappingDir
                        rename { "mapping-${rootProject.ext.versionName}.txt" }
                    }
                    copy {
                        from layout.buildDirectory.dir("outputs/apk/${variantName}")
                        into apkDir
                        include '*.apk'
                        rename { "shizuku-v${rootProject.ext.versionName}-${variantName}.apk" }
                    }
                }
            }
        }
    }
}

tasks.withType(CompileArtProfileTask.class).configureEach {
