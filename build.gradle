plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = '37.0.0'
            ndkVersion = '30.0.14904198'
            defaultConfig {
                minSdk = 24
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
            buildFeatures {
                aidl = true
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
    }
}

apply from: 'api/manifest.gradle.kts'
def gitOutput = { List<String> command ->
    def process = command.execute(null, project.rootDir)
    def output = new StringBuffer()
    def error = new StringBuffer()
    process.waitForProcessOutput(output, error)
    if (process.exitValue() != 0) {
        throw new GradleException("${command.join(' ')} failed: ${error.toString().trim()}")
    }
    return output.toString().trim()
}
def gitCommitId = gitOutput(['git', 'rev-parse', '--short', 'HEAD'])
def gitCommitCount = Integer.parseInt(gitOutput(['git', 'rev-list', '--count', 'HEAD']))
def baseVersionName = "${api_version_major}.6.1-RC2"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}
