name: App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          # Prefer NP-style secrets, then fall back to legacy KEYSTORE_* secrets.
          STORE_B64='${{ secrets.KEY_STORE }}'
          STORE_PASS='${{ secrets.KEY_STORE_PASSWORD }}'
          ALIAS='${{ secrets.ALIAS }}'
          KEY_PASS='${{ secrets.KEY_PASSWORD }}'

          if [ -z "$STORE_B64" ]; then STORE_B64='${{ secrets.KEYSTORE }}'; fi
          if [ -z "$STORE_PASS" ]; then STORE_PASS='${{ secrets.KEYSTORE_PASSWORD }}'; fi
          if [ -z "$ALIAS" ]; then ALIAS='${{ secrets.KEYSTORE_ALIAS }}'; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'; fi

          echo "KEYSTORE_PASSWORD=$STORE_PASS" > signing.properties
          echo "KEYSTORE_ALIAS=$ALIAS" >> signing.properties
          echo "KEYSTORE_ALIAS_PASSWORD=$KEY_PASS" >> signing.properties
          echo "KEYSTORE_FILE=../key.jks" >> signing.properties

          # Use printf to avoid newline/encoding issues when decoding keystore bytes.
          printf '%s' "$STORE_B64" | base64 --decode > key.jks
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew :manager:assembleRelease :manager:assembleDebug
          releaseName=`ls manager/build/outputs/apk/release/shizuku*-v*-release.apk | awk -F '(/|.apk)' '{print $6}'` && echo "releaseName=$releaseName" >> $GITHUB_OUTPUT
          debugName=`ls manager/build/outputs/apk/debug/shizuku*-v*-debug.apk | awk -F '(/|.apk)' '{print $6}'` && echo "debugName=$debugName" >> $GITHUB_OUTPUT
      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildWithGradle.outputs.releaseName }}
          path: "manager/build/outputs/apk/release/*.apk"
      - name: Upload debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildWithGradle.outputs.debugName }}
          path: "manager/build/outputs/apk/debug/*.apk"
      - name: Upload mappings
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: "manager/build/outputs/mapping/release"
